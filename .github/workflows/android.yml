name: Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  checks:
    name: Lint, types, Android bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Verify Android JavaScript and assets
        run: npx expo export --platform android --output-dir dist/android
      - run: npm run typecheck

  build:
    name: Build installable APK (EAS)
    needs: checks
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check EAS prerequisites
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN GitHub Actions secret. See README.md (CI/CD)."
            exit 1
          fi
          node -e "const id = require('./app.json').expo?.extra?.eas?.projectId; if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id ?? '')) { console.error('Run npx eas-cli@25.3.0 init, then include app.json in your changes. See README.md (CI/CD).'); process.exit(1); }"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build APK and wait for completion
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@25.3.0 build --platform android --profile preview --non-interactive --freeze-credentials --wait --json > "$RUNNER_TEMP/eas-build.json"
      - name: Download completed APK
        run: |
          url=$(jq -er 'if length == 1 and .[0].status == "FINISHED" and .[0].platform == "ANDROID" then .[0].artifacts.applicationArchiveUrl | select(type == "string" and startswith("https://")) else error("Expected one finished Android build") end' "$RUNNER_TEMP/eas-build.json")
          mkdir -p artifacts
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' --output artifacts/AquaSeq.apk "$url"
          unzip -tq artifacts/AquaSeq.apk
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AquaSeq-APK-${{ github.sha }}
          path: artifacts/AquaSeq.apk
          if-no-files-found: error
          retention-days: 14
